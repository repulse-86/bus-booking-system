x-app-build: &app-build
  context: .
  dockerfile: ./Dockerfile
  args:
    VITE_APP_NAME: Bus Ticketing System
    VITE_REVERB_APP_KEY: local-key
    VITE_REVERB_HOST: localhost
    VITE_REVERB_PORT: "8080"
    VITE_REVERB_SCHEME: http

x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  DB_CONNECTION: sqlite
  DB_BUSY_TIMEOUT: "5000"
  DB_JOURNAL_MODE: WAL
  DB_SYNCHRONOUS: NORMAL
  SESSION_DRIVER: database
  SESSION_SECURE_COOKIE: "false"
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: public
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: bus-booking
  REVERB_APP_KEY: local-key
  REVERB_APP_SECRET: local-secret
  MAIL_MAILER: log

services:
  app:
    build: *app-build
    ports:
      - "8000:10000"
    env_file:
      - .env
    environment:
      <<: *app-env
      # Server-side broadcasts reach Reverb over the compose network.
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
    depends_on:
      - reverb

  reverb:
    build: *app-build
    command: sh -c 'php artisan reverb:start --host=0.0.0.0 --port=8080'
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      <<: *app-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REVERB_SCALING_ENABLED: "false"
      # The browser connects to localhost:8080, see the VITE_* build args.
      REVERB_HOST: localhost
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
