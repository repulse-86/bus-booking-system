[www]
clear_env = no

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

user = www-data
group = www-data

; The free Render instance has 512 MB of RAM. Keep FPM small enough that the
; web app and the ReactPHP-based Reverb process do not compete for memory.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
